<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Add tasks and remove them when they’re done.</p>

        <form class="input-container" id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                aria-label="Task"
                required
            >
            <button type="submit" id="addBtn">Add Task</button>
        </form>

        <ul id="taskList" aria-label="To-do tasks"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
